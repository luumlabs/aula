name: Debug e2e (temporary)
on:
  push:
    branches: [platform-tests]
    paths: ['.github/workflows/debug-e2e.yml']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Diagnostics spec
        run: |
          cat > tests/e2e/zz-debug.e2e.ts <<'SPEC'
          import { test } from 'playwright/test'
          import { launch } from './helpers'
          for (const hidden of [true, false]) {
            test(`diag hidden=${hidden}`, async () => {
              const { app, page } = await launch({ env: hidden ? { AULA_HIDDEN: '1' } : {} })
              await page.waitForTimeout(1500)
              const info = await page.evaluate(`(async () => ({
                vis: document.visibilityState, focus: document.hasFocus(),
                raf: await Promise.race([new Promise((r) => requestAnimationFrame(() => r('ran'))), new Promise((r) => setTimeout(() => r('timeout'), 2000))]),
                reduced: matchMedia('(prefers-reduced-motion: reduce)').matches, sun: document.documentElement.classList.contains('sun-cursor'),
                canvas: [...document.querySelectorAll('body > canvas')].length
              }))()`)
              const main = await app.evaluate(({ Notification, BrowserWindow }) => {
                const w = BrowserWindow.getAllWindows()
                return { notif: Notification.isSupported(), wins: w.map((x) => ({ vis: x.isVisible(), min: x.isMinimized(), focus: x.isFocused() })) }
              })
              console.log('DIAG', hidden, JSON.stringify(info), JSON.stringify(main))
              if (!hidden) {
                await app.evaluate(({ BrowserWindow }) => BrowserWindow.getAllWindows().find((x) => x.isVisible())?.minimize())
                await page.waitForTimeout(1500)
                const after = await app.evaluate(({ BrowserWindow }) => BrowserWindow.getAllWindows().map((x) => ({ vis: x.isVisible(), min: x.isMinimized() })))
                const vis = await page.evaluate('document.visibilityState')
                const amb = await page.evaluate('document.documentElement.dataset.ambient ?? "run"')
                console.log('DIAG minimize', JSON.stringify(after), vis, amb)
              }
              await app.close()
            })
          }
          SPEC
      - name: Diagnostics without a window manager
        run: xvfb-run -a npx playwright test -c tests/e2e/playwright.config.ts zz-debug cursor interface.e2e.ts:265 power
        continue-on-error: true
      - name: With a window manager (openbox)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends openbox dbus-x11 libnotify4 notification-daemon
          xvfb-run -a sh -c 'openbox & sleep 1; npx playwright test -c tests/e2e/playwright.config.ts zz-debug cursor interface.e2e.ts:265 power'
        continue-on-error: true
