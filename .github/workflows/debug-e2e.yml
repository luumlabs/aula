name: Debug e2e (temporary)
on:
  push:
    branches: [platform-tests]
    paths: ['.github/workflows/debug-e2e.yml']
permissions:
  contents: read
jobs:
  cursor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Diagnostics spec
        shell: bash
        run: |
          cat > tests/e2e/zz-debug.e2e.ts <<'SPEC'
          import { test, expect } from 'playwright/test'
          import { launch } from './helpers'
          for (const hidden of [true, false]) {
            test(`cursor hidden=${hidden}`, async () => {
              const { app, page } = await launch({ env: hidden ? { AULA_HIDDEN: '1' } : {} })
              await expect(page.locator('html.sun-cursor')).toBeAttached()
              await page.evaluate(`(() => {
                window.__moves = 0; window.__trail = 0; window.__frames = 0; window.__err = ''
                window.addEventListener('pointermove', (e) => { window.__moves++; window.__last = [e.clientX, e.clientY, e.pointerType, typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents().length : -1] }, { capture: true })
                const c = [...document.querySelectorAll('body > canvas')].find((x) => x.style.zIndex === '2147483647')
                const start = performance.now()
                const tick = () => {
                  window.__frames++
                  try {
                    const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data
                    let a = 0
                    for (let i = 3; i < d.length; i += 4) a += d[i]
                    window.__trail = Math.max(window.__trail, a)
                  } catch (e) { window.__err = String(e) }
                  if (performance.now() - start < 4000) requestAnimationFrame(tick)
                }
                requestAnimationFrame(tick)
              })()`)
              await page.mouse.move(200, 300)
              await page.mouse.move(900, 420, { steps: 12 })
              await page.waitForTimeout(1500)
              const info = await page.evaluate(`(() => { const c = [...document.querySelectorAll('body > canvas')].find((x) => x.style.zIndex === '2147483647'); return { moves: window.__moves, last: window.__last, trail: window.__trail, frames: window.__frames, err: window.__err, canvas: c ? [c.width, c.height, c.style.width, c.style.height] : null, inner: [innerWidth, innerHeight], dpr: devicePixelRatio, vis: document.visibilityState, focus: document.hasFocus() } })()`)
              console.log('DIAG', hidden, JSON.stringify(info))
              await app.close()
            })
          }
          SPEC
      - name: Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends openbox libnotify4
          xvfb-run -a sh -c 'openbox & npx playwright test -c tests/e2e/playwright.config.ts zz-debug'
        continue-on-error: true
      - name: Windows
        if: runner.os == 'Windows'
        run: npx playwright test -c tests/e2e/playwright.config.ts zz-debug
        continue-on-error: true
