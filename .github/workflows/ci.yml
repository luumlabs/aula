name: CI
# Types, unit tests, build and end-to-end tests (real Electron, simulated AI) on every push to main and every pull request,
# on Linux and Windows (x64 and arm64).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # un sistema que falla no para los demás: se ve todo lo que falla de una vez
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, ubuntu-24.04-arm, windows-11-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        id: build
        if: ${{ !cancelled() }}
        run: npm run build
      # también si fallan las pruebas unitarias: así se ven todos los fallos de una vez
      # Linux: como un escritorio, con gestor de ventanas (minimizar) y libnotify (avisos del sistema)
      - name: Window manager and notifications (Linux)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends openbox libnotify4
      - name: End-to-end tests (real Electron, simulated AI)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: xvfb-run -a sh -c 'openbox & npx playwright test -c tests/e2e/playwright.config.ts'
      - name: End-to-end tests (real Electron, simulated AI)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows' }}
        run: npx playwright test -c tests/e2e/playwright.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7

  native:
    # the Tailscale sidecar (Mac/Linux and the Android client) with its tests, and the Android app (debug key) built
    # with the runner's Android SDK; the APK is kept for a week to try it in an emulator or on a phone
    name: native (tsnet, android)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Go tests and the Linux sidecar
        run: native/tsnet/build.sh test linux
      - name: Android SDK pieces (build-tools 37, android-36)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --install "build-tools;37.0.0" "platforms;android-36" >/dev/null
      - name: Build the Android app (debug key)
        run: native/android/build.sh --debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aula-android-debug
          path: native/android/build/Aula-*-android-debug.apk
          retention-days: 7
