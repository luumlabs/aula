name: CI
# Types, unit tests, build and end-to-end tests (real Electron, simulated AI) on every push to main and every pull request,
# on Linux and Windows (x64 and arm64).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # un sistema que falla no para los demás: se ve todo lo que falla de una vez
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, ubuntu-24.04-arm, windows-11-arm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        id: build
        if: ${{ !cancelled() }}
        run: npm run build
      # también si fallan las pruebas unitarias: así se ven todos los fallos de una vez
      - name: End-to-end tests (real Electron, simulated AI)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Linux' }}
        run: xvfb-run -a npx playwright test -c tests/e2e/playwright.config.ts
      - name: End-to-end tests (real Electron, simulated AI)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && runner.os == 'Windows' }}
        run: npx playwright test -c tests/e2e/playwright.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
