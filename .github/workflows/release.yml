name: Release
# Builds the installers for the version in package.json on macOS, Windows and Linux and uploads them to a DRAFT release
# v<version>. Nothing is published: nobody sees a draft and installed copies aren't offered it until you test it and
# press «Publish release» on GitHub (docs/PUBLISHING.md).
#
# Manual only (Actions → Release → Run workflow). It does NOT run when a tag is pushed: publishing the draft creates the
# tag, and a tag-triggered build would upload untested installers over the ones you just tested.
# It refuses to run if v<version> is already published, or if its draft already has files (e.g. uploaded and tested
# with scripts/release-local.sh) — it never replaces installers that are already there.
# Without GitHub Actions: scripts/release-local.sh on a Mac does the same (docs/PUBLISHING.md).
# Never here: the Mac files (Aula's own certificate) and the Android APK (Aula's Android release key). Both keys live only
# on the maintainer's Mac, which adds those files to this same draft afterwards with
# `scripts/release-local.sh --only mac --only android` and then `--upload` (it adds to an existing draft, never replaces).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.draft.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create the draft release (or stop)
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          TAG="v$V"
          NOTES="docs/release-notes/$V.md"
          test "$(tr -d '[:space:]' < VERSION)" = "$V" || { echo "::error::VERSION doesn't match package.json ($V)"; exit 1; }
          grep -q "## \[$V\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$V] entry"; exit 1; }
          test -f "$NOTES" || { echo "::error::Missing $NOTES"; exit 1; }
          grep -q "releaseNotesFile: $NOTES" electron-builder.yml || { echo "::error::electron-builder.yml releaseInfo.releaseNotesFile must be $NOTES"; exit 1; }
          if gh release view "$TAG" -R "$REPO" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$TAG" -R "$REPO" --json isDraft -q .isDraft)" = true \
              || { echo "::error::$TAG is already published. Bump \"version\" to release again."; exit 1; }
            n=$(gh release view "$TAG" -R "$REPO" --json assets -q '.assets | length')
            test "$n" = 0 || { echo "::error::The draft $TAG already has $n files. Delete them (or the draft) on GitHub first: this workflow never replaces installers."; exit 1; }
            echo "Using the existing empty draft $TAG"
          else
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::The tag $TAG already exists"; exit 1
            fi
            # the GitHub page shows the English part of the notes; installed copies read both languages from latest*.yml
            awk '/<!-- *lang:es *-->/ { exit } { print }' "$NOTES" > "$RUNNER_TEMP/notes.md"
            TITLE=$(sed -n 's/^  releaseName: *//p' electron-builder.yml)
            gh release create "$TAG" -R "$REPO" --draft --target "$GITHUB_SHA" --title "${TITLE:-Aula $V}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # No macOS here: the Mac app is signed with Aula's own certificate («Aula Local Signing»), which only exists on the
        # maintainer's Mac, and installed copies reject an update with any other signature. Build and upload the Mac
        # files (and the Android APK) locally with scripts/release-local.sh --only mac --only android (docs/PUBLISHING.md).
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the Tailscale sidecar inside the Linux app (Aula on your devices, and Aula as a server: docs/SERVER.md); the runner's
      # Go fetches the version in native/tsnet/go.mod and the modules (checked against go.sum)
      # if it's missing, electron-builder only warns ("file source doesn't exist") and uploads packages without it: check
      # both architectures are there before anything is built or uploaded
      - name: Build the Tailscale sidecar for Linux
        if: runner.os == 'Linux'
        run: |
          native/tsnet/build.sh linux
          for a in x64 arm64; do
            test -x "native/tsnet/bin/linux-$a/aula-tsnet" || { echo "::error::native/tsnet/build.sh linux left no native/tsnet/bin/linux-$a/aula-tsnet"; exit 1; }
          done
      # the tests are logic and were written on Linux (paths, links): they run there; CI runs them on every change too
      - name: Type check and unit tests
        if: runner.os == 'Linux'
        run: npm run typecheck && npm test
      - name: Build and upload to the draft
        # releaseType: draft (electron-builder.yml) → uploads to the draft created by «prepare», never publishes
        run: npx electron-vite build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    # GitHub only shows drafts to tokens that can write to the repository
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check every latest*.yml against the uploaded files (SHA-512)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/draft"
          gh release download "v$V" -R "${{ github.repository }}" --dir "$RUNNER_TEMP/draft"
          node scripts/release-verify.mjs "$RUNNER_TEMP/draft" "$V"
          # the Mac files and the Android APK never come from here (their keys live only on the maintainer's Mac)
          for f in latest-mac.yml "Aula-$V-android.apk"; do
            test -f "$RUNNER_TEMP/draft/$f" || echo "::notice title=Still to add from the Mac::$f isn't on the draft yet: scripts/release-local.sh --only mac --only android, then --upload --repo ${{ github.repository }} (it adds to this draft)."
          done
      - name: Check Aula's update signature on every latest*.yml (Ed25519)
        env:
          V: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release-sign.mjs --verify "$RUNNER_TEMP/draft" || {
            echo "::error::The latest*.yml files aren't signed: installed copies would refuse v$V. Sign them on the maintainer's computer (docs/PUBLISHING.md#update-signatures-ed25519) and upload them again before publishing."
            exit 1
          }
          echo "Draft v$V is signed. Once it has every system and the APK, test it, then press «Publish release» on GitHub."
