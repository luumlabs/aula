# Empaquetado de Aula (electron-builder). `npm run dist:mac|win|linux`.
# Firma de macOS desde 0.2.6: Developer ID Application del equipo 87BM9KFJZW, hardened runtime, sello de tiempo seguro
# de Apple y notarización grapada. scripts/release-local.sh fija la identidad por su SHA-1 y comprueba las credenciales
# del notario antes de compilar; la 0.2.5 (certificado local) es el puente inmutable. docs/PUBLISHING.md → Signing.
appId: com.luumlabs.aula
productName: Aula
copyright: Copyright © 2026 Luum Labs
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  - "!**/*.map"
  - "!**/node_modules/**/{test,tests,__tests__,docs,example,examples}/**"
  # fuera los README/CHANGELOG de las dependencias, pero NO sus LICENSE*.md (avisos de licencia obligatorios)
  - "!**/node_modules/**/{README,Readme,readme,CHANGELOG,Changelog,changelog,HISTORY,History,history,CONTRIBUTING,contributing,CODE_OF_CONDUCT,SECURITY,MIGRATION,UPGRADING}*.{md,markdown}"
  # el resumen de licencias va aparte, en Resources (extraResources, abajo); out/.licenses son sus piezas
  - "!out/.licenses/**"
  # @napi-rs/canvas es nativo (uno por sistema y arquitectura): rompe la app universal de macOS y faltaría en los
  # instaladores compilados en otro sistema. pdf.js lee el texto sin él (src/main/services/ingest/extract/pdf.ts).
  - "!**/node_modules/@napi-rs/**"
  # lo que las dependencias traen y Aula no usa (J4-9): tipos de TypeScript; de pdf.js solo hace falta legacy/build
  # (pdf.mjs y pdf.worker.mjs), cmaps, standard_fonts, iccs y wasm (la interfaz lleva su propio pdf.js, ya empaquetado);
  # de docx, la versión para Node (los .cjs; fuera las de navegador). Tesseract 7 necesita también los núcleos
  # completos: su adaptador de Node puede elegirlos incluso con OEM 1. Conservamos las seis parejas JS/WASM,
  # relaxedsimd/simd/básico, completas y LSTM; sólo sobran sus copias en base64 (*.wasm.js).
  - "!**/node_modules/**/*.d.{ts,cts,mts}"
  - "!**/node_modules/pdfjs-dist/{build,web,image_decoders,types}/**"
  - "!**/node_modules/pdfjs-dist/legacy/{web,image_decoders}/**"
  - "!**/node_modules/pdfjs-dist/legacy/build/{*.min.mjs,pdf.sandbox*}"
  - "!**/node_modules/docx/dist/*.{iife.js,mjs}"
  - "!**/node_modules/tesseract.js-core/*.wasm.js"
afterPack: scripts/build/verify-ocr.cjs
# avisos legales legibles fuera del asar (Aula.app/Contents/Resources, o resources/ en Windows y Linux): la licencia
# de Aula y sus términos del §7 (NOTICE.md), los avisos de terceros y el texto de la licencia de cada dependencia que va dentro (lo genera
# scripts/build/third-party-licenses.ts al compilar)
extraResources:
  - { from: LICENSE.md, to: LICENSE.md }
  - { from: NOTICE.md, to: NOTICE.md }
  - { from: THIRD_PARTY_NOTICES.md, to: THIRD_PARTY_NOTICES.md }
  - { from: out/THIRD_PARTY_LICENSES.txt, to: THIRD_PARTY_LICENSES.txt }
asarUnpack:
  - resources/**
  # el puente MCP lo lanzan los agentes de terminal (claude, codex) como proceso aparte: fuera del asar con sus trozos
  - out/main/aula-mcp.js
  - out/main/ingest-worker.js
  - out/main/chunks/**
# Fusibles de Electron: sin NODE_OPTIONS ni --inspect, la app solo se carga de su app.asar verificado y las cookies
# (sesiones de las plataformas) se cifran en disco con la clave del sistema. runAsNode sigue encendido: el puente MCP
# que lanzan los agentes de terminal lo necesita (ELECTRON_RUN_AS_NODE). La interfaz se sirve por app://aula (no por
# file://), así que file:// no tiene privilegios extra: una página no puede leer archivos del disco con fetch('file://…').
electronFuses:
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
mac:
  category: public.app-category.education
  # icono: lo genera `npx electron scripts/dev/icon/build-icons.mjs` (icns con dibujo propio a 16/32 px, .ico y build/icons)
  icon: build/icon.icns
  # macOS 26+: el icono con sus aspectos claro, oscuro y tintado (build/icon.icon, compilado en build/Assets.car por el
  # mismo guion). El sistema lo busca por CFBundleIconName; los macOS anteriores siguen usando icon.icns. No se pone
  # `icon: build/icon.icon` porque electron-builder rehace entonces el .icns a partir de él y se pierde el dibujo propio
  # de los tamaños pequeños.
  extendInfo:
    CFBundleIconName: Icon
  # Developer ID. Sin `identity`: scripts/release-local.sh pasa -c.mac.identity=<SHA-1> de la única «Developer ID
  # Application: … (87BM9KFJZW)» válida (un nombre podría acabar en «Apple Distribution» del mismo equipo). Nunca
  # `identity: "-"`, null ni un `sign` propio: las copias 0.2.5 solo aceptan ese equipo (updates/mac-trust.ts).
  # forceCodeSigning solo en mac (Windows sigue sin firmar): sin identidad falla en vez de salir sin firma. Sin
  # `timestamp` = sello seguro de Apple. Notariza con APPLE_KEYCHAIN_PROFILE (el guion lo exporta y lo prueba antes).
  # allow-jit en la app y en los helpers (Electron y el WASM del OCR lo necesitan con hardened runtime).
  hardenedRuntime: true
  forceCodeSigning: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # «Aula en tus dispositivos»: el componente de Tailscale (native/tsnet/build.sh lo deja universal), en Resources/bin.
  # Se firma con el resto de la app. Si no se compiló, el paquete sale sin él y Ajustes lo dice («no trae la red privada»).
  extraResources:
    - { from: native/tsnet/bin, to: bin, filter: ["aula-tsnet"] }
    - { from: build, to: ".", filter: ["Assets.car"] }
  # el .zip (lo que descargan las actualizaciones) se llama como el .dmg: Aula-<v>-mac.zip
  artifactName: Aula-${version}-mac.${ext}
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
dmg:
  # sin firmar aquí: electron-builder lo firmaría sin notarizar. Lo firma, lo notariza y le grapa el ticket
  # scripts/release-mac-dmg.mjs (release-local.sh), que también rehace su .blockmap y su entrada de latest-mac.yml
  sign: false
  artifactName: Aula-${version}-mac.${ext}
  contents:
    - { x: 150, y: 190 }
    - { x: 390, y: 190, type: link, path: /Applications }
win:
  icon: build/icon.ico
  # «Aula en tus dispositivos»: el componente de Tailscale para Windows (x64 y arm64), uno por arquitectura.
  # `native/tsnet/build.sh windows` lo deja en bin/win-x64 y bin/win-arm64 antes de ejecutar electron-builder.
  extraResources:
    - { from: "native/tsnet/bin/win-${arch}", to: bin, filter: ["aula-tsnet.exe"] }
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: Aula-${version}-win-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: Aula-Setup-${version}.${ext}
linux:
  icon: build/icons
  # el componente de Tailscale de «Aula en tus dispositivos» y de Aula como servidor (docs/SERVER.md), uno por arquitectura:
  # `native/tsnet/build.sh linux` lo deja en bin/linux-x64 y bin/linux-arm64 (el flujo «Release» lo compila antes)
  extraResources:
    - { from: "native/tsnet/bin/linux-${arch}", to: bin, filter: ["aula-tsnet"] }
  category: Education
  synopsis: Your study companion
  description: Turns your notes, slides and past exams, or any topic, into an interactive course and studies it with you.
  # la .deb necesita un responsable con correo (sin él, electron-builder no la genera): la dirección noreply de GitHub
  maintainer: Luum Labs <253840303+luumlabs@users.noreply.github.com>
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64]
  artifactName: Aula-${version}-linux-${arch}.${ext}
publish:
  provider: github
  owner: luumlabs
  repo: aula
  # borrador: nadie lo ve (ni se ofrece como actualización) hasta que se publica a mano en GitHub tras probarlo
  releaseType: draft
# título y notas de la versión (inglés y español); al publicar otra versión, apuntar a sus notas
releaseInfo:
  releaseName: Aula 0.2.8
  releaseNotesFile: docs/release-notes/0.2.8.md
